<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeKnora Chat Demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0f2f5;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── 顶栏 ── */
  .topbar {
    background: #1a1a2e;
    color: #fff;
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .topbar .logo { font-weight: 700; font-size: 16px; letter-spacing: .5px; }
  .topbar .sep  { color: #444; }

  .usid-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
  }
  .usid-bar label { font-size: 13px; color: #aaa; }
  .usid-bar input {
    background: #2a2a40;
    border: 1px solid #3a3a55;
    color: #fff;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 13px;
    width: 160px;
    outline: none;
    transition: border .2s;
  }
  .usid-bar input:focus { border-color: #6c63ff; }
  .usid-bar button {
    background: #6c63ff;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background .2s;
  }
  .usid-bar button:hover { background: #5a52e0; }

  /* ── 主区 ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── 侧栏 ── */
  .sidebar {
    width: 280px;
    background: #fff;
    border-right: 1px solid #e5e7eb;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  /* tab 切换 */
  .tab-bar {
    display: flex;
    border-bottom: 1px solid #e5e7eb;
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1;
    padding: 11px 0;
    font-size: 13px;
    font-weight: 500;
    color: #6b7280;
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color .15s, border-color .15s;
  }
  .tab-btn.active {
    color: #6c63ff;
    border-bottom-color: #6c63ff;
  }

  .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .tab-panel.active { display: flex; }

  /* 知识库 tab */
  .kb-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .kb-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    border: 1.5px solid transparent;
    margin-bottom: 4px;
    transition: background .15s;
  }
  .kb-item:hover { background: #f5f3ff; }
  .kb-item.selected { background: #ede9fe; border-color: #c4b5fd; }
  .kb-item input[type=checkbox] {
    margin-top: 2px;
    accent-color: #6c63ff;
    flex-shrink: 0;
    width: 15px; height: 15px;
  }
  .kb-info { flex: 1; min-width: 0; }
  .kb-name {
    font-size: 13px;
    font-weight: 500;
    color: #111827;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .kb-meta { font-size: 11px; color: #9ca3af; margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }

  .tag { border-radius: 4px; padding: 0 5px; font-size: 11px; font-weight: 500; }
  .tag-acl    { background: #dbeafe; color: #1d4ed8; }
  .tag-common { background: #dcfce7; color: #15803d; }
  .tag-super  { background: #fef3c7; color: #92400e; }
  .tag-admin  { background: #fee2e2; color: #b91c1c; }

  .sidebar-footer {
    padding: 10px 12px;
    border-top: 1px solid #e5e7eb;
    font-size: 12px;
    color: #6b7280;
    flex-shrink: 0;
  }
  .scope-hint { font-style: italic; }

  /* 历史会话 tab */
  .session-toolbar {
    padding: 10px 10px 6px;
    flex-shrink: 0;
  }
  .new-session-btn {
    width: 100%;
    background: #6c63ff;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 8px 0;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .2s;
  }
  .new-session-btn:hover { background: #5a52e0; }
  .new-session-btn:disabled { opacity: .4; cursor: not-allowed; }

  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 8px;
  }
  .session-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 1.5px solid transparent;
    margin-bottom: 4px;
    transition: background .15s;
  }
  .session-item:hover { background: #f5f3ff; }
  .session-item.active {
    background: #ede9fe;
    border-color: #c4b5fd;
  }
  .session-title {
    font-size: 13px;
    font-weight: 500;
    color: #111827;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-meta {
    font-size: 11px;
    color: #9ca3af;
    margin-top: 3px;
  }

  /* ── 聊天区 ── */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 会话标题栏 */
  .chat-header {
    padding: 10px 24px;
    border-bottom: 1px solid #e5e7eb;
    background: #fff;
    font-size: 13px;
    color: #6b7280;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 40px;
  }
  .chat-header .session-badge {
    background: #f3f4f6;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    font-family: monospace;
    color: #374151;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .msg { display: flex; gap: 12px; max-width: 800px; }
  .msg.user      { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    flex-shrink: 0; margin-top: 2px;
  }
  .msg.user .avatar      { background: #6c63ff; color: #fff; }
  .msg.assistant .avatar { background: #1a1a2e; color: #a5b4fc; }

  .bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
    max-width: 640px;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: #6c63ff; color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: #fff; color: #111827;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }

  .refs {
    font-size: 12px; color: #6b7280;
    background: #f9fafb; border: 1px solid #e5e7eb;
    border-radius: 8px; padding: 8px 12px;
    margin-top: 8px; line-height: 1.7;
  }
  .refs strong { color: #374151; }

  .cursor {
    display: inline-block; width: 2px; height: 14px;
    background: #6c63ff; margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink .8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1; gap: 12px; color: #9ca3af;
  }
  .placeholder .icon { font-size: 48px; }
  .placeholder p { font-size: 15px; }

  /* ── 输入区 ── */
  .input-area {
    padding: 16px 32px 20px;
    background: #fff;
    border-top: 1px solid #e5e7eb;
  }
  .input-row {
    display: flex; gap: 10px; align-items: flex-end;
    background: #f9fafb; border: 1.5px solid #e5e7eb;
    border-radius: 12px; padding: 8px 8px 8px 16px;
    transition: border .2s;
  }
  .input-row:focus-within { border-color: #6c63ff; }
  textarea {
    flex: 1; border: none; background: transparent;
    resize: none; outline: none;
    font-size: 14px; line-height: 1.6;
    max-height: 120px; font-family: inherit; color: #111827;
  }
  .send-btn {
    width: 36px; height: 36px; border-radius: 8px;
    background: #6c63ff; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .2s, opacity .2s;
  }
  .send-btn:hover    { background: #5a52e0; }
  .send-btn:disabled { opacity: .4; cursor: not-allowed; }
  .send-btn svg { fill: #fff; width: 16px; height: 16px; }

  .input-hint { font-size: 11px; color: #9ca3af; margin-top: 6px; padding-left: 4px; }

  /* ── 通知 / 错误 ── */
  .notice {
    padding: 12px 32px; text-align: center;
    font-size: 13px; color: #6b7280;
  }
  .divider {
    text-align: center; font-size: 12px; color: #9ca3af;
    display: flex; align-items: center; gap: 10px;
    padding: 0 4px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; border-top: 1px solid #e5e7eb;
  }
  .error-msg {
    background: #fef2f2; border: 1px solid #fecaca;
    color: #b91c1c; border-radius: 8px;
    padding: 10px 14px; font-size: 13px;
    max-width: 480px; align-self: center;
  }

  /* ── spinner ── */
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #e5e7eb; border-top-color: #6c63ff;
    border-radius: 50%; animation: spin .7s linear infinite;
    display: inline-block; vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="logo">WeKnora</span>
  <span class="sep">|</span>
  <span style="font-size:13px;color:#aaa;">Chat Demo</span>
  <div class="usid-bar">
    <label for="usidInput">usid</label>
    <input id="usidInput" type="text" placeholder="如 hanwzhan" autocomplete="off" />
    <button onclick="loadUser()">加载</button>
  </div>
</div>

<div class="main">

  <!-- 侧栏 -->
  <div class="sidebar">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('kb')">知识库</button>
      <button class="tab-btn"        onclick="switchTab('sessions')">历史会话</button>
    </div>

    <!-- 知识库 tab -->
    <div class="tab-panel active" id="tabKB">
      <div class="kb-list" id="kbList">
        <div class="notice">输入 usid 后点击「加载」</div>
      </div>
      <div class="sidebar-footer">
        <div class="scope-hint" id="scopeHint">未选择 = 搜全部有权限的知识库</div>
      </div>
    </div>

    <!-- 历史会话 tab -->
    <div class="tab-panel" id="tabSessions">
      <div class="session-toolbar">
        <button class="new-session-btn" id="newSessionBtn" onclick="newSession()" disabled>＋ 新建会话</button>
      </div>
      <div class="session-list" id="sessionList">
        <div class="notice">加载 usid 后显示历史会话</div>
      </div>
    </div>
  </div>

  <!-- 聊天区 -->
  <div class="chat-area">
    <div class="chat-header" id="chatHeader">
      <span>请先加载 usid</span>
    </div>
    <div class="messages" id="messages">
      <div class="placeholder">
        <div class="icon">💬</div>
        <p>加载 usid 后即可开始对话</p>
      </div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <textarea id="queryInput" rows="1" placeholder="输入问题，Enter 发送，Shift+Enter 换行…" disabled></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="input-hint" id="inputHint">请先加载 usid</div>
    </div>
  </div>

</div>

<script>
const BASE_URL = "http://10.47.202.30:8080";
const API_KEY  = "sk-1IRFIgX0H5pOFedi2az-SUCuwoq9Q_Y0ptU1O8PqpGhZhO36";

let currentUsid    = "";
let currentSession = "";
let kbData         = [];
let sessionData    = [];
let isStreaming    = false;

// ── 工具 ─────────────────────────────────────────────────────────────────────

function hdrs(extra = {}) {
  return { "X-API-Key": API_KEY, "Content-Type": "application/json", ...extra };
}
function selectedKbIds() {
  return [...document.querySelectorAll(".kb-item input:checked")].map(c => c.dataset.id);
}
function scrollBottom() {
  const m = document.getElementById("messages");
  m.scrollTop = m.scrollHeight;
}
function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}
function escHtml(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/\n/g,"<br>");
}
function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("zh-CN", { month:"numeric", day:"numeric",
    hour:"2-digit", minute:"2-digit" });
}

// ── tab 切换 ──────────────────────────────────────────────────────────────────

function switchTab(name) {
  document.querySelectorAll(".tab-btn").forEach((b, i) => {
    b.classList.toggle("active", (i === 0 && name === "kb") || (i === 1 && name === "sessions"));
  });
  document.getElementById("tabKB").classList.toggle("active", name === "kb");
  document.getElementById("tabSessions").classList.toggle("active", name === "sessions");
  if (name === "sessions" && currentUsid) loadSessionList();
}

// ── 加载 usid ─────────────────────────────────────────────────────────────────

async function loadUser() {
  const usid = document.getElementById("usidInput").value.trim();
  if (!usid) return;

  const kbListEl = document.getElementById("kbList");
  kbListEl.innerHTML = `<div class="notice"><span class="spinner"></span>查询权限中…</div>`;

  try {
    const res  = await fetch(
      `${BASE_URL}/api/v1/permissions/searchable-kbs?usid=${encodeURIComponent(usid)}`,
      { headers: hdrs() }
    );
    const data = await res.json();
    if (!res.ok) {
      kbListEl.innerHTML = `<div class="notice" style="color:#b91c1c">查询失败: ${data.message || res.status}</div>`;
      return;
    }
    kbData       = data.data || [];
    currentUsid  = usid;
    renderKBList();
    document.getElementById("newSessionBtn").disabled = false;

    // 新建会话
    await newSession();
    // 预加载会话列表
    await loadSessionList();
  } catch (e) {
    kbListEl.innerHTML = `<div class="notice" style="color:#b91c1c">网络错误: ${e.message}</div>`;
  }
}

// ── 知识库列表 ────────────────────────────────────────────────────────────────

function renderKBList() {
  const el = document.getElementById("kbList");
  if (kbData.length === 0) {
    el.innerHTML = `<div class="notice">该 usid 无可访问的知识库</div>`;
    return;
  }
  const label = { acl:"授权", common:"公共", super:"全量" };
  el.innerHTML = kbData.map(kb => {
    const stag = `<span class="tag tag-${kb.source}">${label[kb.source] || kb.source}</span>`;
    const rtag = kb.role === "admin" ? `<span class="tag tag-admin">admin</span>` : "";
    return `
      <label class="kb-item" onclick="syncKB(this)">
        <input type="checkbox" data-id="${kb.kb_id}" onchange="onKBChange()">
        <div class="kb-info">
          <div class="kb-name" title="${kb.kb_id}">${escHtml(kb.name || kb.kb_id)}</div>
          <div class="kb-meta">${stag}${rtag}
            <span style="color:#c4b5fd;font-size:10px">${kb.kb_id.slice(0,8)}…</span>
          </div>
        </div>
      </label>`;
  }).join("");
}

function syncKB(label) {
  setTimeout(() => {
    const cb = label.querySelector("input");
    label.classList.toggle("selected", cb.checked);
    onKBChange();
  }, 0);
}
function onKBChange() {
  const ids   = selectedKbIds();
  const hint  = document.getElementById("scopeHint");
  if (!ids.length) { hint.textContent = "未选择 = 搜全部有权限的知识库"; return; }
  const names = ids.map(id => { const k = kbData.find(x => x.kb_id === id); return k ? k.name || id : id; });
  hint.textContent = "检索范围: " + names.join("、");
}

// ── 会话列表 ──────────────────────────────────────────────────────────────────

async function loadSessionList() {
  const el = document.getElementById("sessionList");
  el.innerHTML = `<div class="notice"><span class="spinner"></span>加载中…</div>`;
  try {
    const res  = await fetch(
      `${BASE_URL}/api/v1/sessions?usid=${encodeURIComponent(currentUsid)}&page=1&page_size=50`,
      { headers: hdrs() }
    );
    const data = await res.json();
    sessionData = data.data || [];
    renderSessionList();
  } catch (e) {
    el.innerHTML = `<div class="notice" style="color:#b91c1c">加载失败: ${e.message}</div>`;
  }
}

function renderSessionList() {
  const el = document.getElementById("sessionList");
  if (!sessionData.length) {
    el.innerHTML = `<div class="notice">暂无历史会话</div>`;
    return;
  }
  el.innerHTML = sessionData.map(s => {
    const title   = s.title || "新会话";
    const timeStr = fmtTime(s.updated_at || s.created_at);
    const active  = s.id === currentSession ? "active" : "";
    return `
      <div class="session-item ${active}" data-id="${s.id}" onclick="resumeSession('${s.id}', this)">
        <div class="session-title" title="${escHtml(title)}">${escHtml(title)}</div>
        <div class="session-meta">${timeStr}&nbsp;·&nbsp;<span style="font-family:monospace;font-size:10px">${s.id.slice(0,8)}…</span></div>
      </div>`;
  }).join("");
}

// ── 新建 / 复用 session ───────────────────────────────────────────────────────

async function newSession() {
  try {
    const res  = await fetch(`${BASE_URL}/api/v1/sessions`, {
      method: "POST",
      headers: hdrs({ "X-User-Id": currentUsid }),
      body: JSON.stringify({}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || res.status);
    currentSession = data.data.id;
    clearMessages();
    updateChatHeader("新会话", currentSession);
    enableChat();
    // 刷新会话列表
    await loadSessionList();
  } catch (e) {
    appendError(`创建会话失败: ${e.message}`);
  }
}

async function resumeSession(sessionId, el) {
  if (isStreaming) return;
  currentSession = sessionId;

  // 高亮选中项
  document.querySelectorAll(".session-item").forEach(x => x.classList.remove("active"));
  el.classList.add("active");

  clearMessages();
  const title = el.querySelector(".session-title").textContent;
  updateChatHeader(title, sessionId);
  enableChat();

  // 拉取历史消息
  appendNotice(`<span class="spinner"></span>加载历史消息…`);
  try {
    const res  = await fetch(
      `${BASE_URL}/api/v1/messages/${sessionId}/load`,
      { headers: hdrs({ "X-User-Id": currentUsid }) }
    );
    const data = await res.json();
    clearMessages();
    const msgs = data.data || data.messages || [];
    if (!msgs.length) {
      appendNotice("暂无历史消息，直接发问即可");
    } else {
      appendDivider(`历史消息（共 ${msgs.length} 条）`);
      msgs.forEach(renderHistoryMsg);
      appendDivider("以上为历史记录");
    }
    scrollBottom();
  } catch (e) {
    clearMessages();
    appendError(`加载历史失败: ${e.message}`);
  }

  // 切到聊天视图
  document.getElementById("queryInput").focus();
}

function renderHistoryMsg(msg) {
  const role    = msg.role || (msg.type === "human" ? "user" : "assistant");
  const content = msg.content || msg.text || "";
  if (!content) return;
  if (role === "user" || role === "human") {
    appendUserBubble(content);
  } else {
    appendAssistantHistory(content);
  }
}

// ── 消息渲染 ──────────────────────────────────────────────────────────────────

function updateChatHeader(title, sessionId) {
  document.getElementById("chatHeader").innerHTML =
    `<span style="font-weight:500;color:#374151">${escHtml(title)}</span>
     <span class="session-badge">${sessionId.slice(0,8)}…</span>`;
}

function clearMessages() {
  document.getElementById("messages").innerHTML = "";
}

function appendNotice(html) {
  const m = document.getElementById("messages");
  const d = document.createElement("div");
  d.className = "notice"; d.innerHTML = html;
  m.appendChild(d); scrollBottom();
}

function appendDivider(text) {
  const m = document.getElementById("messages");
  m.insertAdjacentHTML("beforeend", `<div class="divider">${escHtml(text)}</div>`);
}

function appendUserBubble(text) {
  const m = document.getElementById("messages");
  const initials = currentUsid.slice(0,2).toUpperCase();
  m.insertAdjacentHTML("beforeend", `
    <div class="msg user">
      <div class="avatar">${initials}</div>
      <div class="bubble">${escHtml(text)}</div>
    </div>`);
}

function appendAssistantHistory(text) {
  const m = document.getElementById("messages");
  m.insertAdjacentHTML("beforeend", `
    <div class="msg assistant">
      <div class="avatar">W</div>
      <div><div class="bubble">${escHtml(text)}</div></div>
    </div>`);
}

function appendAssistantBubble() {
  const m    = document.getElementById("messages");
  const wrap = document.createElement("div");
  wrap.className = "msg assistant";
  wrap.innerHTML = `
    <div class="avatar">W</div>
    <div>
      <div class="bubble" id="streamBubble"><span class="cursor"></span></div>
      <div class="refs"   id="streamRefs"   style="display:none"></div>
    </div>`;
  m.appendChild(wrap); scrollBottom();
  return {
    bubble: document.getElementById("streamBubble"),
    refs:   document.getElementById("streamRefs"),
  };
}

function appendError(msg) {
  document.getElementById("messages").insertAdjacentHTML(
    "beforeend", `<div class="error-msg">⚠️ ${escHtml(msg)}</div>`
  );
  scrollBottom();
}

// ── 聊天 ─────────────────────────────────────────────────────────────────────

function enableChat() {
  const q = document.getElementById("queryInput");
  q.disabled = false;
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("inputHint").textContent = "Enter 发送 · Shift+Enter 换行";
}

async function sendMessage() {
  if (isStreaming || !currentUsid || !currentSession) return;
  const input = document.getElementById("queryInput");
  const query = input.value.trim();
  if (!query) return;

  input.value = ""; input.style.height = "auto";
  appendUserBubble(query);

  const kbIds   = selectedKbIds();
  const payload = { query, agent_id: "builtin-quick-answer" };
  if (kbIds.length) payload.knowledge_base_ids = kbIds;

  isStreaming = true;
  document.getElementById("sendBtn").disabled = true;
  input.disabled = true;

  const { bubble, refs } = appendAssistantBubble();
  let answerText = "";

  try {
    const res = await fetch(
      `${BASE_URL}/api/v1/knowledge-chat/${currentSession}`,
      {
        method: "POST",
        headers: hdrs({ "X-User-Id": currentUsid }),
        body: JSON.stringify(payload),
      }
    );

    if (res.status === 401) { bubble.remove(); refs.remove(); appendError("401 — 未提供 X-User-Id"); return; }
    if (res.status === 403) { bubble.remove(); refs.remove(); appendError("403 — usid 无权访问所请求的知识库"); return; }
    if (!res.ok) {
      const t = await res.text();
      bubble.remove(); refs.remove();
      appendError(`HTTP ${res.status} — ${t.slice(0,200)}`); return;
    }

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        let evt;
        try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
        const rt = evt.response_type;
        if (rt === "references") {
          const list = evt.knowledge_references || [];
          if (list.length) {
            const titles = [...new Set(list.map(r => r.knowledge_title || r.knowledge_id || "?"))];
            refs.style.display = "block";
            refs.innerHTML = `<strong>引用来源：</strong>${titles.map(escHtml).join("、")}`;
          }
        } else if (rt === "answer") {
          const piece = evt.content || "";
          if (piece) {
            answerText += piece;
            bubble.innerHTML = escHtml(answerText) + '<span class="cursor"></span>';
            scrollBottom();
          }
          if (evt.done) bubble.innerHTML = escHtml(answerText);
        } else if (rt === "error") {
          bubble.innerHTML = escHtml(answerText || "（上游错误）");
          appendError(evt.content || "上游 LLM 错误");
        }
      }
    }
    if (bubble.querySelector(".cursor")) bubble.innerHTML = escHtml(answerText);
    // 问答完成后刷新会话列表（标题可能已更新）
    loadSessionList();
  } catch (e) {
    bubble.innerHTML = escHtml(answerText || "");
    appendError(`网络错误: ${e.message}`);
  } finally {
    isStreaming = false;
    input.disabled = false;
    document.getElementById("sendBtn").disabled = false;
    input.focus(); scrollBottom();
  }
}

// ── 键盘 ─────────────────────────────────────────────────────────────────────

document.addEventListener("DOMContentLoaded", () => {
  const input     = document.getElementById("queryInput");
  const usidInput = document.getElementById("usidInput");
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  input.addEventListener("input", () => autoResize(input));
  usidInput.addEventListener("keydown", e => { if (e.key === "Enter") loadUser(); });
});
</script>
