<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WeKnora PDF 预览测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 20px; background: #f5f5f5; }
        h1 { margin-bottom: 20px; color: #333; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: 500; color: #555; }
        input { width: 100%; max-width: 600px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        button { padding: 8px 20px; background: #1890ff; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px; }
        button:hover { background: #40a9ff; }
        button.secondary { background: #52c41a; }
        button.secondary:hover { background: #73d13d; }
        .preview-container { margin-top: 20px; border: 1px solid #ddd; border-radius: 4px; background: #fff; min-height: 600px; }
        iframe { width: 100%; height: 800px; border: none; }
        .error { color: #ff4d4f; margin-top: 10px; }
        .info { color: #666; font-size: 12px; margin-top: 4px; }
        .tabs { display: flex; gap: 8px; margin-top: 20px; margin-bottom: 0; }
        .tab { padding: 8px 16px; background: #e8e8e8; border-radius: 4px 4px 0 0; cursor: pointer; border: 1px solid #ddd; border-bottom: none; }
        .tab.active { background: #fff; font-weight: 500; }
        .chunks-container { padding: 20px; max-height: 800px; overflow-y: auto; background: #fff; border: 1px solid #ddd; border-radius: 0 4px 4px 4px; }
        .chunk-item { padding: 12px; margin-bottom: 8px; background: #fafafa; border-radius: 4px; border-left: 3px solid #1890ff; }
        .chunk-index { font-size: 12px; color: #999; margin-bottom: 4px; }
        .chunk-content { white-space: pre-wrap; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <h1>WeKnora 文档预览测试</h1>

    <div class="form-group">
        <label>后端地址</label>
        <input id="baseUrl" value="http://10.47.202.30:8080" placeholder="http://10.47.202.30:8080">
    </div>
    <div class="form-group">
        <label>API Key（sk- 开头）</label>
        <input id="token" type="text" placeholder="输入你的 API Key，如 sk-xxxxx">
        <div class="info">即你在系统中生成的 API Key</div>
    </div>
    <div class="form-group">
        <label>Knowledge Base ID（知识库 ID）</label>
        <input id="kbId" placeholder="知识库 ID，用于列出文档">
        <div class="info">从 URL 中获取，如 /knowledge-bases/<strong>这个ID</strong>/...</div>
    </div>
    <div class="form-group">
        <label>Knowledge ID（文档 ID）</label>
        <input id="knowledgeId" placeholder="文档的 knowledge ID">
        <button onclick="listDocuments()" style="margin-top:4px;">加载文档列表</button>
        <select id="docSelect" style="display:none; margin-top:8px; width:100%; max-width:600px; padding:8px;" onchange="selectDoc()"></select>
    </div>

    <div style="margin-top: 16px;">
        <button onclick="previewPDF()">预览 PDF 原文件</button>
        <button class="secondary" onclick="loadChunks()">查看解析后的 Markdown 内容</button>
    </div>

    <div id="error" class="error"></div>

    <div class="tabs" id="tabs" style="display:none;">
        <div class="tab active" id="tab-pdf" onclick="showTab('pdf')">PDF 预览</div>
        <div class="tab" id="tab-chunks" onclick="showTab('chunks')">Markdown 内容</div>
    </div>

    <div class="preview-container" id="pdf-panel" style="display:none;">
        <iframe id="pdfFrame"></iframe>
    </div>

    <div class="chunks-container" id="chunks-panel" style="display:none;"></div>

    <script>
        function getConfig() {
            return {
                baseUrl: document.getElementById('baseUrl').value.replace(/\/$/, ''),
                token: document.getElementById('token').value.trim(),
                kbId: document.getElementById('kbId').value.trim(),
                knowledgeId: document.getElementById('knowledgeId').value.trim()
            };
        }

        async function listDocuments() {
            showError('');
            const { baseUrl, token, kbId } = getConfig();
            if (!token || !kbId) { showError('请填写 API Key 和 Knowledge Base ID'); return; }

            try {
                const resp = await fetch(`${baseUrl}/api/v1/knowledge-bases/${kbId}/knowledge?page=1&page_size=50`, {
                    headers: { 'X-API-Key': token }
                });
                if (!resp.ok) {
                    const text = await resp.text();
                    showError(`请求失败 (${resp.status}): ${text}`);
                    return;
                }
                const data = await resp.json();
                const items = data.data || data.items || [];
                const select = document.getElementById('docSelect');
                select.style.display = 'block';
                select.innerHTML = '<option value="">-- 选择文档 --</option>' +
                    items.map(item => `<option value="${item.id}">${item.title || item.file_name || item.id}</option>`).join('');
            } catch (e) {
                showError(`请求出错: ${e.message}`);
            }
        }

        function selectDoc() {
            const val = document.getElementById('docSelect').value;
            if (val) document.getElementById('knowledgeId').value = val;
        }

        function showError(msg) {
            document.getElementById('error').textContent = msg;
        }

        function showTab(tab) {
            document.getElementById('tab-pdf').className = tab === 'pdf' ? 'tab active' : 'tab';
            document.getElementById('tab-chunks').className = tab === 'chunks' ? 'tab active' : 'tab';
            document.getElementById('pdf-panel').style.display = tab === 'pdf' ? 'block' : 'none';
            document.getElementById('chunks-panel').style.display = tab === 'chunks' ? 'block' : 'none';
        }

        async function previewPDF() {
            showError('');
            const { baseUrl, token, knowledgeId } = getConfig();
            if (!token || !knowledgeId) { showError('请填写 Token 和 Knowledge ID'); return; }

            try {
                const resp = await fetch(`${baseUrl}/api/v1/knowledge/${knowledgeId}/preview`, {
                    headers: { 'X-API-Key': token }
                });

                if (!resp.ok) {
                    const text = await resp.text();
                    showError(`请求失败 (${resp.status}): ${text}`);
                    return;
                }

                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                document.getElementById('pdfFrame').src = url;
                document.getElementById('tabs').style.display = 'flex';
                document.getElementById('pdf-panel').style.display = 'block';
                document.getElementById('chunks-panel').style.display = 'none';
                showTab('pdf');
            } catch (e) {
                showError(`请求出错: ${e.message}`);
            }
        }

        async function loadChunks() {
            showError('');
            const { baseUrl, token, knowledgeId } = getConfig();
            if (!token || !knowledgeId) { showError('请填写 Token 和 Knowledge ID'); return; }

            try {
                const resp = await fetch(`${baseUrl}/api/v1/chunks/${knowledgeId}?chunk_type=text&page_size=200`, {
                    headers: { 'X-API-Key': token }
                });

                if (!resp.ok) {
                    const text = await resp.text();
                    showError(`请求失败 (${resp.status}): ${text}`);
                    return;
                }

                const data = await resp.json();
                const chunks = data.data || data.items || data.chunks || [];
                const container = document.getElementById('chunks-panel');

                if (chunks.length === 0) {
                    container.innerHTML = '<div style="color:#999;">未找到任何 chunks，文档可能还在解析中。</div>';
                } else {
                    container.innerHTML = chunks.map((chunk, i) => `
                        <div class="chunk-item">
                            <div class="chunk-index">Chunk #${chunk.chunk_index ?? i} | Type: ${chunk.chunk_type || 'text'}</div>
                            <div class="chunk-content">${escapeHtml(chunk.content)}</div>
                        </div>
                    `).join('');
                }

                document.getElementById('tabs').style.display = 'flex';
                showTab('chunks');
            } catch (e) {
                showError(`请求出错: ${e.message}`);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
    </script>
</body>
</html>
